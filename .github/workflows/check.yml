name: Samad check
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'send test Telegram message'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Write monitor script
        run: |
          cat > monitor.py <<'PYEOF'
          import os, re, json, urllib.request, urllib.parse
          from playwright.sync_api import sync_playwright

          LOGIN_URL = "https://samad.app/login"
          UNIVERSITY = "شهید بهشتی"
          WEEK_TEXT = "هفته بعد"
          FOOD_URL = os.environ.get("FOOD_URL", "").strip()
          USER = os.environ["SAMAD_USER"]
          PASS = os.environ["SAMAD_PASS"]
          TG_TOKEN = os.environ["TG_TOKEN"]
          TG_CHAT = os.environ["TG_CHAT_ID"]
          STATE = "state.txt"

          # بررسی صفحه غذا (بعد از لاگین)
          JS_FOOD = """
          (function(WEEK){
            function clickText(t){
              var all=document.querySelectorAll('button,a,li,div,span,label,[role=tab]');
              var best=null;
              for(var i=0;i<all.length;i++){
                var tx=(all[i].innerText||'').trim();
                if(tx.indexOf(t)>-1 && (!best || tx.length<(best.innerText||'').trim().length)) best=all[i];
              }
              if(best){best.click();return true;}
              return false;
            }
            clickText(WEEK);
            var body=document.body.innerText;
            var closed=['باز نشده','غیرفعال','ثبت نشده','موجود نیست'];
            for(var j=0;j<closed.length;j++){ if(body.indexOf(closed[j])>-1) return 'closed'; }
            return body.indexOf('رزرو')>-1 ? 'open' : 'closed';
          })
          """

          def tg(text):
              data = urllib.parse.urlencode({"chat_id": TG_CHAT, "text": text}).encode()
              urllib.request.urlopen(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage", data, timeout=20)

          def read_state():
              try:
                  return open(STATE).read().strip()
              except FileNotFoundError:
                  return ""

          def snapshot(page, name):
              """اسکرین‌شات بدون اطلاعات حساس (فیلدها قبل از عکس پاک می‌شوند)"""
              try:
                  page.evaluate("document.querySelectorAll('input').forEach(i=>{if(i.type!=='hidden'){i.value=''}})")
              except Exception:
                  pass
              page.screenshot(path=name + ".png", full_page=True)

          def login(page):
              page.goto(LOGIN_URL, timeout=60000)
              page.wait_for_load_state("networkidle")
              page.wait_for_timeout(2000)

              # فیلد اول: انتخاب دانشگاه
              first = page.locator("input:visible, select:visible").first
              tag = first.evaluate("e=>e.tagName.toLowerCase()")
              if tag == "select":
                  val = first.evaluate(
                      "(e,t)=>{for(const o of e.options){if(o.text.indexOf(t)>-1)return o.value}return null}", UNIVERSITY)
                  first.select_option(value=val)
              else:
                  first.click()
                  page.wait_for_timeout(800)
                  try:
                      first.fill(UNIVERSITY)
                  except Exception:
                      pass
                  page.wait_for_timeout(1500)
                  opt = page.get_by_role("option", name=re.compile(UNIVERSITY))
                  if opt.count() == 0:
                      opt = page.get_by_text(UNIVERSITY)
                  opt.first.click()
              page.wait_for_timeout(1500)

              # فیلد دوم و سوم: کاربری و رمز
              texts = page.locator("input:visible:not([type=password])")
              user = texts.nth(1 if tag != "select" else 0)
              pw = page.locator("input[type=password]:visible").first
              user.fill(USER)
              pw.fill(PASS)
              page.wait_for_timeout(500)

              btn = page.locator("button[type=submit]:visible, button:has-text('ورود'):visible")
              if btn.count():
                  btn.first.click()
              else:
                  pw.press("Enter")
              page.wait_for_load_state("networkidle", timeout=30000)
              page.wait_for_timeout(4000)
              return page.locator("input[type=password]:visible").count() == 0

          def run():
              with sync_playwright() as p:
                  b = p.chromium.launch()
                  page = b.new_page(locale="fa-IR")
                  try:
                      ok = login(page)
                  except Exception as e:
                      print("login exception:", e)
                      ok = False
                  if not ok:
                      snapshot(page, "debug")
                      open("debug.html", "w", encoding="utf-8").write(page.content())
                      b.close()
                      return "error_login"
                  if FOOD_URL:
                      page.goto(FOOD_URL, timeout=60000)
                      page.wait_for_load_state("networkidle")
                      page.wait_for_timeout(3000)
                  status = "closed"
                  for _ in range(2):  # بار اول کلیک روی تب هفته بعد، بار دوم نتیجه
                      status = page.evaluate(JS_FOOD + "(%s)" % json.dumps(WEEK_TEXT))
                      page.wait_for_timeout(3000)
                  snapshot(page, "debug")
                  open("debug.html", "w", encoding="utf-8").write(page.content())
                  b.close()
              return status

          def main():
              if os.environ.get("TEST") == "true":
                  tg("✅ تست تلگرام موفق بود")
              prev = read_state()
              try:
                  status = run()
              except Exception as e:
                  status = "error_exception"
                  print("ERR", e)
              print("status:", status, "prev:", prev)
              if status == "open" and prev != "open":
                  tg("🔔 غذای هفته بعد در سمد باز شد! بدو رزرو کن")
              elif status.startswith("error") and prev != status:
                  tg("⚠️ پایش سمد خطا داد (%s). لاگین یا ساختار صفحه را چک کنید." % status)
              elif prev.startswith("error") and not status.startswith("error"):
                  tg("✅ لاگین سمد درست شد؛ وضعیت فعلی: %s" % status)
              open(STATE, "w").write(status)

          main()
          PYEOF
      - name: Run check
        env:
          SAMAD_USER: ${{ secrets.SAMAD_USER }}
          SAMAD_PASS: ${{ secrets.SAMAD_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FOOD_URL: ${{ vars.FOOD_URL }}
          TEST: ${{ inputs.test }}
        run: python monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: |
            debug.png
            debug.html
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.txt || true
          git diff --cached --quiet || (git commit -m "state" && git push)
